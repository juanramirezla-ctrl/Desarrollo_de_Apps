<ion-header>
  <ion-toolbar color="primary">
    <ion-title>ion-button</ion-title>
  </ion-toolbar>
</ion-header>
<p>Buttons provide a clickable element, which can be used in forms, or anywhere that needs simple, standard button functionality. They may display text, icons, or both. Buttons can be styled with several attributes to look a specific way.</p>
<h2>Example</h2>
<ion-content>
  <ion-button>Default</ion-button> <ion-button [disabled]="true">Disabled</ion-button>
</ion-content>

<div class="tarjeta-calculadora">
  <h2>Calculadora Basica</h2>

  <div class="campo">
    <label for="num1">Primer valor:</label>
    <input 
      id="num1" 
      type="number" 
      [(ngModel)]="primerNumero" 
      placeholder="Ej: 10" 
    />
  </div>

  <div class="campo">
    <label for="operacion">Operación:</label>
    <select id="operacion" [(ngModel)]="operacionSeleccionada">
      <option value="+">Suma (+)</option>
      <option value="-">Resta (-)</option>
      <option value="*">Multiplicación (×)</option>
      <option value="/">División (÷)</option>
    </select>
  </div>

  <div class="campo">
    <label for="num2">Segundo valor:</label>
    <input 
      id="num2" 
      type="number" 
      [(ngModel)]="segundoNumero" 
      placeholder="Ej: 5" 
    />
  </div>

  <button (click)="calcular()">Obtener resultado</button>

  <div class="caja-resultado" *ngIf="resultadoOperacion !== null">
    <span>Resultado: {{ resultadoOperacion }}</span>
  </div>
</div>

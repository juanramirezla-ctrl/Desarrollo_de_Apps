<ion-header>
  <ion-toolbar color="primary">
    <ion-title>ion-progress-bar</ion-title>
  </ion-toolbar>
</ion-header>
<p>Progress bars inform users about the status of ongoing processes, such as loading an app, submitting a form, or saving updates. There are two types of progress bars: determinate and indeterminate.</p>
<h2>Example</h2>
<ion-content>
<ion-progress-bar [value]="progress()"></ion-progress-bar>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-title>ion-toggle</ion-title>
  </ion-toolbar>
</ion-header>
<p>Toggles are switches that change the state of a single option. They can be switched on or off by pressing or swiping them. Toggles can also be checked programmatically by setting the checked property.</p>
<h2>Examples</h2>
<ion-content>
<ion-toggle>Default Toggle</ion-toggle><br /><br />
<ion-toggle [checked]="true">Checked Toggle</ion-toggle><br /><br />
<ion-toggle [disabled]="true">Disabled Toggle</ion-toggle><br /><br />
<ion-toggle [checked]="true" [disabled]="true">Disabled Checked Toggle</ion-toggle>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-title>ion-chip</ion-title>
  </ion-toolbar>
</ion-header>
<p>Chips represent complex entities in small blocks, such as a contact. A chip can contain several different elements such as avatars, text, and icons.</p>
<h2>Example</h2>
<ion-content>
<ion-chip>Default</ion-chip>
<ion-chip [disabled]="true">Disabled</ion-chip>
<ion-chip [outline]="true">Outline</ion-chip>
</ion-content>

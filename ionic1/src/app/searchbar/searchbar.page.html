<ion-header>
  <ion-toolbar>
    <ion-title>ion-searchbar</ion-title>
  </ion-toolbar>
</ion-header>
<p>Searchbars represent a text field that can be used to search through a collection. They can be displayed inside of a toolbar or the main content. A searchbar should be used instead of an input to search lists.</p>
<h2>Example</h2>
<ion-content>
<ion-searchbar></ion-searchbar>
<ion-searchbar placeholder="Custom Placeholder"></ion-searchbar>
<ion-searchbar disabled="true" placeholder="Disabled"></ion-searchbar>
<ion-searchbar value="Value"></ion-searchbar>
<ion-searchbar animated="true" placeholder="Animated"></ion-searchbar>
</ion-content>
